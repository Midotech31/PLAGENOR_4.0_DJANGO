{% load i18n static dashboard_extras %}
{% service_presentation service as equipment %}
<figure class="service-equipment{% if detail %} service-equipment--detail{% endif %}">
    {% if equipment.photo_static %}
    <img src="{% static equipment.photo_static %}" alt="{{ equipment.photo_alt|catalogue_text }}" width="1824" height="1368" loading="lazy" decoding="async">
    {% endif %}
    <div class="service-equipment-placeholder" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v7l-6 9a1 1 0 0 0 1 2h14a1 1 0 0 0 1-2l-6-9V3M8 15h8"/></svg>
    </div>
    {% if equipment.equipment %}
    <figcaption>
        <span class="equipment-label">{{ "Équipement associé"|catalogue_text }}</span>
        <strong>{{ equipment.equipment|catalogue_text }}</strong>
        {% if equipment.photo_static %}<small>{{ equipment.photo_alt|catalogue_text }}</small>{% endif %}
    </figcaption>
    {% endif %}
</figure>
