name: Django CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    name: build (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Settings require a SECRET_KEY unless DEBUG; DATABASE_URL is left unset
      # so the suite runs on the SQLite fallback.
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "true"
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install document and i18n system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext libreoffice-writer default-jre-headless poppler-utils fonts-dejavu-core fonts-liberation2
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip check
    - name: Validate Django, migrations, templates and translations
      run: |
        python manage.py check
        python manage.py makemigrations --check --dry-run
        python manage.py compilemessages
        python manage.py shell -c "from django.template.loader import engines; from pathlib import Path; e=engines['django'].engine; fs=list(Path('templates').rglob('*.html'))+list(Path('notifications/templates').rglob('*.html')); [e.get_template(str(p.relative_to('templates')) if str(p).startswith('templates/') else str(p.relative_to('notifications/templates'))) for p in fs]; print(f'TEMPLATES_OK={len(fs)}')"
    - name: Run tests with coverage
      env:
        PLAGENOR_DOCUMENT_PREVIEW_DIR: document-previews
      run: |
        coverage run manage.py test
        # Enforced regression floor, verified by the full Django suite.
        coverage json -o coverage.json
        coverage report --fail-under=100
    - name: Render document previews with LibreOffice
      run: |
        set -euo pipefail
        mkdir -p document-previews/pdf document-previews/render-smoke
        export HOME="${RUNNER_TEMP}/libreoffice-home"
        mkdir -p "$HOME"

        docx_count=$(find document-previews -maxdepth 1 -type f -name '*.docx' | wc -l)
        test "$docx_count" -ge 10

        : > document-previews/VALIDATION.txt
        for docx in document-previews/*.docx; do
          soffice --headless --convert-to pdf --outdir document-previews/pdf "$docx"
        done

        pdf_count=$(find document-previews/pdf -maxdepth 1 -type f -name '*.pdf' | wc -l)
        test "$pdf_count" -eq "$docx_count"

        for pdf in document-previews/pdf/*.pdf; do
          name=$(basename "$pdf")
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          test "$pages" -ge 1
          pdfinfo "$pdf" | grep -Eq 'Page size:.*A4'
          pdftotext "$pdf" - | grep -q '[[:alnum:]]'
          stem="${name%.pdf}"
          mkdir -p "document-previews/render-smoke/$stem"
          pdftoppm -f 1 -singlefile -png -r 120 "$pdf" "document-previews/render-smoke/$stem/page-1" >/dev/null 2>&1
          test -s "document-previews/render-smoke/$stem/page-1.png"
          echo "$name|pages=$pages|A4=PASS|text=PASS|render=PASS" >> document-previews/VALIDATION.txt
        done

        cat document-previews/VALIDATION.txt

    - name: Upload coverage and rendered document evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: application-validation
        path: |
          coverage.json
          core/ibtikar/definitions.json
          document-previews/*.docx
          document-previews/pdf/*.pdf
          document-previews/VALIDATION.txt
        if-no-files-found: error
        retention-days: 30

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit bandit
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
      - name: Static security scan
        run: |
          bandit -r accounts core dashboard documents notifications plagenor erp \
            -x '*/migrations/*,*/tests.py,*/test_*.py,*/tests/*' -ll

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plagenor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: plagenor_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plagenor -d plagenor_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://plagenor:ci-only-password@127.0.0.1:5432/plagenor_ci
      DATABASE_SSL_REQUIRE: "false"
      # The Django test client sends plain HTTP requests. Production keeps the
      # secure default because this override exists only inside this CI job.
      SECURE_SSL_REDIRECT: "false"
      TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      REQUIRE_PERSISTENT_MEDIA_STORAGE: "false"
      REQUIRE_SMTP: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r requirements-dev.txt
          pip check
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
      - name: Verify multi-sample HTTP submission on PostgreSQL
        run: python manage.py test core.test_ibtikar_acceptance.AcceptanceFlows.test_two_hundred_rows_survive_the_http_parser_and_draft_save
      - name: Verify operational and planning concurrency on PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p test-results/postgres
          git rev-parse HEAD > test-results/postgres/commit.txt
          python manage.py test erp.test_postgres_operations --noinput --verbosity 2 2>&1 | tee test-results/postgres/operations.log
      - name: Run PostgreSQL regression suite
        run: |
          set -euo pipefail
          mkdir -p test-results/postgres
          git rev-parse HEAD > test-results/postgres/commit.txt
          sha256sum core/test_ibtikar_acceptance.py core/test_ibtikar_forms.py core/ibtikar/definitions.json > test-results/postgres/source-before.sha256
          python manage.py test --noinput --verbosity 2 2>&1 | tee test-results/postgres/tests.log
      - name: Preserve PostgreSQL regression evidence
        if: always()
        run: |
          mkdir -p test-results/postgres
          sha256sum core/test_ibtikar_acceptance.py core/test_ibtikar_forms.py core/ibtikar/definitions.json > test-results/postgres/source-after.sha256
          cp core/test_ibtikar_acceptance.py core/test_ibtikar_forms.py test-results/postgres/
      - name: Upload PostgreSQL regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-regression-evidence
          path: test-results/postgres/
          if-no-files-found: error
          retention-days: 14
      - name: Synthetic PostgreSQL backup and restore
        env:
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          dump_file="$(mktemp --suffix=.dump)"
          trap 'rm -f "$dump_file"' EXIT
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$dump_file"
          pg_restore --list "$dump_file" >/dev/null
          dropdb --if-exists -h 127.0.0.1 -U plagenor plagenor_restore_ci
          createdb -h 127.0.0.1 -U plagenor plagenor_restore_ci
          pg_restore -h 127.0.0.1 -U plagenor -d plagenor_restore_ci \
            --no-owner --no-privileges "$dump_file"
          psql -h 127.0.0.1 -U plagenor -d plagenor_restore_ci \
            -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM django_migrations;' >/dev/null
          dropdb -h 127.0.0.1 -U plagenor plagenor_restore_ci

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag plagenor-ci:${{ github.sha }} .
      - name: Verify non-root runtime and Django startup
        run: |
          test "$(docker image inspect plagenor-ci:${{ github.sha }} --format '{{.Config.User}}')" = "plagenor"
          docker run --rm \
            -e DEBUG=true \
            -e SECRET_KEY=container-ci-only-key \
            -e REQUIRE_PERSISTENT_MEDIA_STORAGE=false \
            -e REQUIRE_SMTP=false \
            plagenor-ci:${{ github.sha }} python manage.py check
      - name: Start Gunicorn and verify HTTP health endpoints
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 18000:8000 \
            -e DEBUG=true \
            -e SECRET_KEY=container-ci-only-key \
            -e REQUIRE_PERSISTENT_MEDIA_STORAGE=false \
            -e REQUIRE_SMTP=false \
            -e WEB_CONCURRENCY=2 \
            plagenor-ci:${{ github.sha }} \
            sh -c 'python manage.py migrate --noinput && exec gunicorn plagenor.wsgi:application --workers "$WEB_CONCURRENCY" --bind 0.0.0.0:8000 --access-logfile - --error-logfile -')
          trap 'docker logs "$container_id"; docker rm --force "$container_id" >/dev/null' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18000/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Gunicorn did not become healthy" >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18000/readyz | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          test "$(docker inspect "$container_id" --format '{{.State.Running}}')" = "true"

  browser-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECRET_KEY: e2e-only-secret-key
      DEBUG: "true"
      DJANGO_SETTINGS_MODULE: plagenor.settings_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install application and browser-test dependencies
        run: |
          pip install -r requirements.txt
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium firefox
      - name: Compile application translations
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
          python manage.py compilemessages
      - name: Run browser E2E and WCAG 2.2 AA gates
        run: npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-accessibility-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 30
