name: Django CI

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sqlite:
    runs-on: ubuntu-latest
    env:
      # Settings require a SECRET_KEY unless DEBUG; DATABASE_URL is left unset
      # so the suite runs on the SQLite fallback.
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "true"
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install gettext (for i18n)
      run: sudo apt-get update && sudo apt-get install -y gettext
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: System check
      run: python manage.py check
    - name: Run tests with coverage
      run: |
        pip install coverage
        coverage run manage.py test
        # Current measured floor. Raise it as regression tests are added;
        # never claim a threshold the suite does not yet meet.
        coverage report --fail-under=40
    - name: Dependency vulnerability audit
      run: |
        pip install pip-audit
        pip-audit -r requirements.txt
    - name: Static security scan
      run: |
        pip install bandit
        bandit -r accounts core dashboard documents notifications plagenor \
          -x '*/migrations/*,*/tests.py' -ll

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: plagenor
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: plagenor_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plagenor -d plagenor_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://plagenor:ci-only-password@127.0.0.1:5432/plagenor_ci
      TOTP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      PRIVILEGED_MFA_ENFORCEMENT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
      - run: python manage.py test
      - name: Synthetic PostgreSQL backup and restore
        env:
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          dump_file="$(mktemp --suffix=.dump)"
          trap 'rm -f "$dump_file"' EXIT
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file="$dump_file"
          pg_restore --list "$dump_file" >/dev/null
          dropdb --if-exists -h 127.0.0.1 -U plagenor plagenor_restore_ci
          createdb -h 127.0.0.1 -U plagenor plagenor_restore_ci
          pg_restore -h 127.0.0.1 -U plagenor -d plagenor_restore_ci \
            --no-owner --no-privileges "$dump_file"
          psql -h 127.0.0.1 -U plagenor -d plagenor_restore_ci \
            -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM django_migrations;' >/dev/null
          dropdb -h 127.0.0.1 -U plagenor plagenor_restore_ci
