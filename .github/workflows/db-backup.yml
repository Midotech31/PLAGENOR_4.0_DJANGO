name: Database Backup

# Weekly (Mondays 03:00 UTC) + on-demand. The database dump is encrypted with
# age before it is uploaded. The unencrypted dump never becomes an artifact.
#
# SETUP: repo Settings → Secrets and variables → Actions → New secret
#        DATABASE_URL: production PostgreSQL connection string
#        BACKUP_AGE_RECIPIENT: age public recipient (for example age1...)
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Require backup secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL is required" >&2; exit 1; }
          test -n "$BACKUP_AGE_RECIPIENT" || { echo "BACKUP_AGE_RECIPIENT is required" >&2; exit 1; }

      - name: Install PostgreSQL 16 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 age

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          ts=$(date -u +%Y%m%d-%H%M%S)
          umask 077
          plain="$(mktemp --suffix=.dump)"
          trap 'rm -f "$plain"' EXIT
          /usr/lib/postgresql/16/bin/pg_dump "$DATABASE_URL" \
            --format=custom --no-owner --no-privileges --file="$plain"
          /usr/lib/postgresql/16/bin/pg_restore --list "$plain" >/dev/null
          age --recipient "$BACKUP_AGE_RECIPIENT" \
            --output "plagenor-backup-$ts.dump.age" "$plain"
          test -s "plagenor-backup-$ts.dump.age"
          rm -f "$plain"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: plagenor-backup-*.dump.age
          if-no-files-found: error
          retention-days: 90
