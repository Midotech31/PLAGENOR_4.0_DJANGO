name: Database Backup

# Weekly production backup (Mondays 03:00 UTC) + on-demand.\n# A push to main triggers a smoke backup only when the backup subsystem itself changes.
#
# GitHub stores NO production database credential and NO encryption key.
# The job requests a short-lived GitHub OIDC token. PLAGENOR validates the
# token's signature plus repository/ref/workflow/event claims, creates the
# pg_dump inside the production container, validates it with pg_restore --list,
# encrypts it, and persists it to private Supabase-backed storage.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/db-backup.yml'
      - 'plagenor/github_backup.py'
      - 'scripts/production_inventory_bootstrap.py'
      - 'requirements.txt'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the matching production commit
        env:
          PLAGENOR_READY_URL: https://plagenor.onrender.com/readyz
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail --connect-timeout 15 --max-time 30 "$PLAGENOR_READY_URL" || true)"
            deployed="$(python -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' <<<"$body" 2>/dev/null || true)"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Production is ready on commit $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for production commit (attempt $attempt/60)"
            sleep 10
          done
          echo "Production did not reach GitHub SHA $GITHUB_SHA" >&2
          exit 1

      - name: Request signed OIDC token and create encrypted backup
        env:
          BACKUP_ENDPOINT: https://plagenor.onrender.com/ops/github/database-backup/
        run: |
          set -euo pipefail
          umask 077

          token_response="$(curl --silent --show-error --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=plagenor-production-backup")"
          oidc_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_response")"
          test -n "$oidc_token"

          curl --silent --show-error --fail-with-body --connect-timeout 30 --max-time 900 --request POST --header "Authorization: Bearer $oidc_token" --header "Accept: application/json" --output backup-metadata.json "$BACKUP_ENDPOINT"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("backup-metadata.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          required = {
              "status", "created_at", "backup_object",
              "ciphertext_sha256", "plaintext_sha256",
              "plaintext_bytes", "ciphertext_bytes",
              "database_name", "postgres_server_version", "render_commit",
          }
          missing = sorted(required - data.keys())
          if missing:
              raise SystemExit(f"Backup response missing fields: {missing}")
          if data["status"] != "ok":
              raise SystemExit("Backup endpoint did not report success")
          if data["render_commit"] != os.environ["GITHUB_SHA"]:
              raise SystemExit(
                  "Backup was produced by a different deployed commit: "
                  + str(data["render_commit"])
              )
          if not str(data["backup_object"]).startswith("database_backups/"):
              raise SystemExit("Backup object is outside the private backup prefix")
          if len(str(data["ciphertext_sha256"])) != 64:
              raise SystemExit("Invalid ciphertext SHA-256")
          if int(data["plaintext_bytes"]) <= 0 or int(data["ciphertext_bytes"]) <= 0:
              raise SystemExit("Backup size must be positive")

          print("Encrypted production backup verified.")
          print("Object:", data["backup_object"])
          print("Ciphertext SHA-256:", data["ciphertext_sha256"])
          print("PostgreSQL:", data["postgres_server_version"])
          PY

      - name: Upload non-secret backup evidence
        uses: actions/upload-artifact@v7
        with:
          name: db-backup-evidence
          path: backup-metadata.json
          if-no-files-found: error
          retention-days: 90
