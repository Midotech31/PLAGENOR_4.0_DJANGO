# Render.com blueprint — free Django web service for PLAGENOR.
# Database: use your existing Supabase Postgres (paste its URL into DATABASE_URL).
services:
  - type: web
    name: plagenor
    runtime: docker
    plan: free
    region: frankfurt        # proche de la base Supabase (Irlande) -> moins de latence
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /readyz
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true            # Render generates a strong key
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WEB_CONCURRENCY
        value: "2"                     # conservative default for Render free memory
      - key: DATABASE_URL
        sync: false                    # paste your Supabase connection string
      - key: TOTP_ENCRYPTION_KEY
        sync: false                    # Fernet key; keep stable across deploys
      - key: PRIVILEGED_MFA_ENFORCEMENT
        value: "true"
      - key: CSP_REPORT_ONLY
        value: "true"                  # staged rollout; monitor before enforcing
      - key: TRUST_PROXY_HEADERS
        value: "true"                  # Render owns the final X-Forwarded-For hop
      - key: REQUIRE_PERSISTENT_MEDIA_STORAGE
        value: "true"                  # fail boot rather than lose uploads on ephemeral disk
      - key: REQUIRE_SMTP
        value: "true"                  # never print recovery/tracking tokens to production logs
      - key: ALLOWED_HOSTS
        sync: false                    # your domain(s); the *.onrender.com host is auto-added
      - key: CSRF_TRUSTED_ORIGINS
        sync: false                    # optional (auto-derived from ALLOWED_HOSTS)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: "media"
