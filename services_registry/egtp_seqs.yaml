# =====================================================
# PLAGENOR / IBTIKAR — Service Registry
# Service: EGTP-SeqS
# =====================================================

service_code: EGTP-SeqS
service_name: DNA Sequencing via Sanger Method
category: DNA Sequencing
type: Analysis
version: "1.0"

description: >
  High-quality DNA sequencing using the Sanger method for PCR amplicons.
  The service supports sequencing of purified or non-purified PCR products
  using forward, reverse, or bidirectional reads. Results are delivered
  as chromatograms and FASTA sequence files. No identification or
  interpretation is included.

# -----------------------------------------------------
# PARAMETERS
# -----------------------------------------------------
parameters:
  - name: analysis_frame
    label: Cadre de l’analyse
    type: enum
    required: true
    options:
      - PFE Classique
      - "1275"
      - "008"
      - Projet de doctorat
      - Autre

  - name: sequencing_mode
    label: Sequencing direction
    type: enum
    required: true
    options:
      - Forward
      - Reverse
      - Forward + Reverse

  - name: sample_purity
    label: PCR product status
    type: enum
    required: true
    options:
      - Purified
      - Non-purified

# -----------------------------------------------------
# SAMPLE TABLE (ONE ROW = ONE AMPLICON)
# -----------------------------------------------------
sample_table:
  enabled: true
  min_rows: 1

  columns:
    - name: sample_code
      label: "Code"
      type: string
      required: true

    - name: nom_du_gene
      label: "Nom du géne"
      type: string
      required: false

    - name: taille_du_gene
      label: "Taille du géne (pb)"
      type: string
      required: false

    - name: source_origine_de_l_echantillon
      label: "Source/origine de l’échantillon"
      type: string
      required: false

    - name: sequences_des_amorces_utilisees
      label: "Séquences des amorces utilisées (5’-3’)"
      type: string
      required: false

    - name: remarques_particulieres
      label: "Remarques particulières"
      type: string
      required: false

# -----------------------------------------------------
# PRICING (SUPPORTED MODEL)
# -----------------------------------------------------
pricing:
  model: per_sample_table_row_with_multiplier
  currency: DZD

  base_price:
    non_pathogenic: 5500
    pathogenic: 5500

  multipliers:
    Forward: 1
    Reverse: 1
    Forward + Reverse: 1.9
    Non-purified: 1.3

# -----------------------------------------------------
# REQUIRED BY REGISTRY LOADER
# -----------------------------------------------------
deliverables:
  - ABI chromatogram file(s) (.ab1)
  - FASTA sequence file(s)
  - Basic sequencing quality check

turnaround_time: >
  Standard turnaround time is 10–15 working days from receipt
  of compliant PCR products and primers.

compliance:
  - Minimum volume and concentration requirements must be respected
  - PCR products must be clearly labeled
  - Primers must be supplied separately
  - Non-compliant samples may be rejected

override_policy:
  admin_override_allowed: true
  justification_required: true
  audit_required: true

# Names and descriptions are required in all three interface languages.
translations:
  fr:
    name: Séquençage de l’ADN par la méthode Sanger
    description: Séquençage de haute qualité de l’ADN par la méthode Sanger pour les amplicons PCR. La prestation
      prend en charge les produits PCR purifiés ou non purifiés, avec des lectures sens, antisens ou bidirectionnelles.
      Les résultats sont remis sous forme de chromatogrammes et de fichiers de séquences FASTA. Aucune identification
      ni interprétation n’est incluse.
  ar:
    name: تسلسل الحمض النووي DNA بطريقة سانغر
    description: تسلسل عالي الجودة للحمض النووي DNA بطريقة سانغر لنواتج تضخيم PCR. تدعم الخدمة نواتج PCR المنقّاة
      وغير المنقّاة، بقراءات أمامية أو عكسية أو في الاتجاهين. تُسلّم النتائج في صورة مخططات كروماتوغرافية وملفات
      تسلسل FASTA. لا تشمل الخدمة التعرّف على الكائنات أو تفسير النتائج.
  en:
    name: DNA Sequencing via Sanger Method
    description: High-quality DNA sequencing using the Sanger method for PCR amplicons. The service supports sequencing
      of purified or non-purified PCR products using forward, reverse, or bidirectional reads. Results are delivered
      as chromatograms and FASTA sequence files. No identification or interpretation is included.

# Public presentation only; never used for pricing or eligibility.
presentation:
  equipment: "Analyseur génétique pour le séquençage Sanger"
  overview: "Le séquençage Sanger permet de lire une séquence d’ADN ciblée. Le sens de lecture demandé et l’état du produit fourni déterminent le périmètre de la prestation. L’identification d’un microorganisme par comparaison de séquences relève de la prestation dédiée."
