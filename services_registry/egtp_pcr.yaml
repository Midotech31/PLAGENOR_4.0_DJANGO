# =====================================================
# PLAGENOR / IBTIKAR — Service Registry
# Service: EGTP-PCR
# =====================================================

service_code: EGTP-PCR
service_name: PCR (Polymerase Chain Reaction)
category: Molecular Biology
type: Analysis
version: "1.0"

description: >
  PCR (Polymerase Chain Reaction) is a molecular biology technique used to
  amplify specific DNA sequences. The service includes reaction setup using
  requester-supplied primers, amplification on a gradient thermal cycler,
  and verification by agarose gel electrophoresis.

# -----------------------------------------------------
# PARAMETERS
# -----------------------------------------------------
parameters:
  - name: analysis_frame
    label: Cadre de l’analyse
    type: enum
    required: true
    options:
      - PFE Classique
      - "1275"
      - "008"
      - Projet de doctorat
      - Autre

  # NOTE: "Origine de l'ADN" and "Type de l'ADN" are PER-SAMPLE on the
  # official IBTIKAR form (columns of the sample table), so they live in
  # sample_table.columns below — not as global parameters. Keeping them as
  # global params would force a double entry and leave the form's per-row
  # columns blank.

  - name: pcr_kit
    label: PCR kit
    label_fr: Type de kit PCR
    type: enum
    required: true
    options:
      - Standard Taq
      - High-Fidelity
      - GC-Rich

  - name: qc_level
    label: Quality control level
    label_fr: Techniques de contrôle qualité
    type: enum
    required: true
    options:
      - None
      - Gel
      - ScanDrop + Gel

  - name: size_marker
    label: Size marker for agarose gel electrophoresis
    label_fr: Marqueur de taille
    type: enum
    required: true
    options:
      - "100 bp ladder"
      - "1 kb ladder"
      - "GeneRuler 1 kb Plus"
      - Autre

  - name: product_volume_ul
    label: PCR product volume to recover after amplification
    label_fr: Volume du produit de PCR à récupérer après amplification
    type: enum
    required: false
    options:
      - 25 µL
      - 50 µL

  - name: product_recovery
    label: PCR product recovery
    label_fr: Récupération du produit de PCR
    type: boolean
    required: true

# -----------------------------------------------------
# SAMPLE TABLE (ONE ROW = ONE PCR REACTION)
# -----------------------------------------------------
sample_table:
  enabled: true
  min_rows: 1

  # One row = one PCR reaction. Columns mirror the official IBTIKAR form's
  # sample grid so every box on the printed fiche is captured online.
  columns:
    - name: sample_code
      label: Code
      type: string
      required: true

    - name: dna_origin
      label: Origine de l’ADN
      type: enum
      required: true
      options:
        - Environmental
        - Food
        - Hospital / Clinical

    - name: dna_type
      label: Type de l’ADN
      type: enum
      required: true
      options:
        - Plasmidic
        - Chromosomal
        - Genomic

    - name: extraction_method
      label: Méthode de l’extraction d’ADN
      type: string
      required: false

    - name: target_gene
      label: Gène cible / Taille de l’amplicon
      type: string
      required: true

    - name: primer_sequences
      label: Séquences des amorces utilisées (5’-3’)
      type: string
      required: false

    - name: tm
      label: Tm (°C)
      type: number
      required: false

    - name: remarks
      label: Remarques particulières
      type: string
      required: false

# -----------------------------------------------------
# PRICING (SUPPORTED MODEL)
# -----------------------------------------------------
pricing:
  model: per_sample_table_row_with_multiplier
  currency: DZD

  base_price:
    non_pathogenic: 1500
    pathogenic: 1500

  multipliers:
    None: 1
    Gel: 1.3
    ScanDrop + Gel: 1.6

# -----------------------------------------------------
# REQUIRED BY REGISTRY LOADER
# -----------------------------------------------------
deliverables:
  - Gel image confirming amplification
  - Optional recovered PCR product
  - QC results if applicable

turnaround_time: >
  Standard turnaround time is up to 10 working days from receipt
  of compliant DNA samples and primers.

compliance:
  - Minimum of 10 µL DNA per reaction at 50–300 ng required
  - Forward and reverse primers (10 µM) must be supplied
  - Biosafety declaration required for clinical DNA

override_policy:
  admin_override_allowed: true
  justification_required: true
  audit_required: true
