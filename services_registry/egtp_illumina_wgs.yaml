# =====================================================
# PLAGENOR / IBTIKAR — Service Registry
# Service: EGTP-Illumina-Microbial-WGS
# =====================================================

service_code: EGTP-Illumina-Microbial-WGS
service_name: Microbial Whole Genome Sequencing (Illumina)
category: High-Throughput Sequencing
type: Analysis
version: "1.0"

description: >
  Whole Genome Sequencing (WGS) of microbial isolates using Illumina
  high-throughput sequencing technology. The service includes genomic DNA
  extraction from pure cultures, nucleic acid quality control, Illumina
  library preparation, paired-end sequencing, and delivery of raw sequencing
  data.

# -----------------------------------------------------
# PARAMETERS
# -----------------------------------------------------
parameters:
  - name: analysis_frame
    label: Cadre de l’analyse
    type: enum
    required: true
    options:
      - PFE Classique
      - "1275"
      - "008"
      - Projet de doctorat
      - Autre

  - name: organism_type
    label: Type of microorganism
    type: enum
    required: true
    options:
      - Bacterium
      - Yeast
      - Mould

  - name: sample_origin
    label: Source of isolation
    type: enum
    required: true
    options:
      - Environmental
      - Food
      - Hospital / Clinical

  - name: pathogenic
    label: Pathogenic isolate
    type: boolean
    required: true

  - name: sequencing_depth
    label: Sequencing depth
    type: enum
    required: true
    options:
      - Standard
      - High

# -----------------------------------------------------
# SAMPLE TABLE
# -----------------------------------------------------
sample_table:
  enabled: true
  min_rows: 1

  columns:
    - name: sample_code
      label: "Code"
      type: string
      required: true

    - name: type_de_microorganisme
      label: "Type de microorganisme (Bactérie, levure, moisissure)"
      type: string
      required: false

    - name: source_d_isolement
      label: "Source d’isolement (environnementale, alimentaire, clinique, etc.)"
      type: string
      required: false

    - name: milieu_de_culture_approprie
      label: "Milieu de culture approprié"
      type: string
      required: false

    - name: conditions_de_culture
      label: "Conditions de culture (Température, type respiratoire, durée d’incubation)"
      type: string
      required: false

    - name: remarques_particulieres
      label: "Remarques particulières"
      type: string
      required: false

# -----------------------------------------------------
# PRICING (SUPPORTED MODEL)
# -----------------------------------------------------
pricing:
  model: per_sample_table_row_with_multiplier
  currency: DZD

  base_price:
    non_pathogenic: 95000
    pathogenic: 95000

  multipliers:
    Standard: 1
    High: 1.32   # 125000 / 95000 ≈ 1.32

# -----------------------------------------------------
# REQUIRED BY REGISTRY LOADER
# -----------------------------------------------------
deliverables:
  - Paired-end FASTQ files
  - Basic sequencing run quality metrics

turnaround_time: >
  Typical turnaround time is 4 to 6 weeks from acceptance of compliant samples.

compliance:
  - Fresh, pure cultures are mandatory.
  - Biosafety declaration required for clinical or pathogenic isolates.
  - Transport must comply with PLAGENOR biosafety rules.

override_policy:
  admin_override_allowed: true
  justification_required: true
  audit_required: true

# Names and descriptions are required in all three interface languages.
translations:
  fr:
    name: Séquençage du génome entier microbien (Illumina)
    description: Séquençage du génome entier (WGS) d’isolats microbiens par la technologie Illumina à haut débit.
      La prestation comprend l’extraction de l’ADN génomique à partir de cultures pures, le contrôle qualité des
      acides nucléiques, la préparation des banques Illumina, le séquençage à lectures appariées et la remise des
      données brutes de séquençage.
  ar:
    name: تسلسل الجينوم الميكروبي الكامل (Illumina)
    description: تسلسل الجينوم الكامل (WGS) للعزلات الميكروبية بتقنية Illumina عالية الإنتاجية. تشمل الخدمة استخلاص
      الحمض النووي الجينومي من مزارع نقية، ومراقبة جودة الأحماض النووية، وتحضير مكتبات Illumina، والتسلسل بقراءات
      مزدوجة النهاية، وتسليم بيانات التسلسل الخام.
  en:
    name: Microbial Whole Genome Sequencing (Illumina)
    description: Whole Genome Sequencing (WGS) of microbial isolates using Illumina high-throughput sequencing technology.
      The service includes genomic DNA extraction from pure cultures, nucleic acid quality control, Illumina library
      preparation, paired-end sequencing, and delivery of raw sequencing data.

# Public presentation only; never used for pricing or eligibility.
presentation:
  equipment: "Séquenceur Illumina MiSeq"
  overview: "Le séquençage du génome entier fournit des données génomiques sur un isolat microbien. Le périmètre de préparation, de contrôle qualité et d’analyse des données est à préciser avec la plateforme ; cette prestation se distingue du profilage ciblé 16S."
  photo_static: "images/equipment/miseq.jpg"
  photo_alt: "Séquenceur Illumina MiSeq — PLAGENOR"
