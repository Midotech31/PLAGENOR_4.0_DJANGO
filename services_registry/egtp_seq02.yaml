# =====================================================
# PLAGENOR / IBTIKAR — Service Registry
# Service: EGTP-Seq02
# =====================================================

service_code: EGTP-Seq02
service_name: Microbial Identification via Sequencing
category: Microbial Identification
type: Analysis
version: "1.0"

description: >
  Accurate taxonomic identification of microorganisms using PCR amplicon
  Sanger sequencing with universal genetic markers such as 16S rRNA, ITS,
  and 18S rRNA. The workflow includes DNA extraction, PCR amplification,
  amplicon cleanup, and Sanger sequencing. Identification is reported at
  species level when sequence quality and database coverage allow.

# -----------------------------------------------------
# PARAMETERS
# -----------------------------------------------------
parameters:
  - name: analysis_frame
    label: Cadre de l’analyse
    type: enum
    required: true
    options:
      - PFE Classique
      - "1275"
      - "008"
      - Projet de doctorat
      - Autre

  - name: target_marker
    label: Target genetic marker
    type: enum
    required: true
    options:
      - 16S rRNA
      - ITS
      - 18S rRNA

  - name: sequencing_mode
    label: Sequencing mode
    type: enum
    required: true
    options:
      - F
      - F+R
      - F+R-long

  - name: sample_origin
    label: Sample origin
    type: enum
    required: true
    options:
      - Environmental
      - Food
      - Hospital / Clinical

# -----------------------------------------------------
# SAMPLE TABLE (ONE ROW = ONE SAMPLE)
# -----------------------------------------------------
sample_table:
  enabled: true
  min_rows: 1

  columns:
    - name: sample_code
      label: "Code"
      type: string
      required: true

    - name: type_d_echantillon
      label: "Type d’échantillon (Sang, bactérie, tissu animal...)"
      type: string
      required: false

    - name: date_de_prelevement
      label: "Date de prélèvement"
      type: string
      required: false

    - name: volume_quantite
      label: "Volume (µl) / Quantité (g)"
      type: string
      required: false

    - name: condition_de_stockage_etat_de_l_echantil
      label: "Condition de stockage / Etat de l’échantillon"
      type: string
      required: false

    - name: remarques_particulieres
      label: "Remarques particulières"
      type: string
      required: false

# -----------------------------------------------------
# PRICING (SUPPORTED MODEL)
# -----------------------------------------------------
pricing:
  model: per_sample_table_row_with_multiplier
  currency: DZD

  base_price:
    non_pathogenic: 8000
    pathogenic: 8000

  multipliers:
    F: 1
    F+R: 1.6
    F+R-long: 1.8

# -----------------------------------------------------
# REQUIRED BY REGISTRY LOADER
# -----------------------------------------------------
deliverables:
  - ABI chromatogram file(s) (.ab1)
  - FASTA sequence file(s)
  - Sequencing quality control summary

turnaround_time: >
  Standard turnaround time is up to 15 working days from receipt
  of compliant samples, depending on workload and complexity.

compliance:
  - Pure cultures or adequate biological material are mandatory
  - Minimum input quantities must be respected
  - Clinical or hospital samples require biosafety declaration

override_policy:
  admin_override_allowed: true
  justification_required: true
  audit_required: true

# Names and descriptions are required in all three interface languages.
translations:
  fr:
    name: Identification microbienne par séquençage
    description: Identification taxonomique des microorganismes par séquençage Sanger d’amplicons PCR, à l’aide
      de marqueurs génétiques universels tels que l’ARNr 16S, l’ITS et l’ARNr 18S. La prestation comprend l’extraction
      de l’ADN, l’amplification PCR, la purification des amplicons et le séquençage Sanger. L’identification est
      rapportée au niveau de l’espèce lorsque la qualité des séquences et la couverture des bases de données le
      permettent.
  ar:
    name: التعرّف على الكائنات الحية الدقيقة بالتسلسل
    description: التعرّف التصنيفي على الكائنات الحية الدقيقة بتسلسل سانغر لنواتج تضخيم PCR، باستخدام واسمات جينية
      عامة مثل الرنا الريبوسومي 16S وITS والرنا الريبوسومي 18S. تشمل الخدمة استخلاص DNA، والتضخيم بتقنية PCR، وتنقية
      نواتج التضخيم، وتسلسل سانغر. يُحدّد الكائن على مستوى النوع عندما تسمح جودة التسلسل وتغطية قواعد البيانات بذلك.
  en:
    name: Microbial Identification via Sequencing
    description: Accurate taxonomic identification of microorganisms using PCR amplicon Sanger sequencing with universal
      genetic markers such as 16S rRNA, ITS, and 18S rRNA. The workflow includes DNA extraction, PCR amplification,
      amplicon cleanup, and Sanger sequencing. Identification is reported at species level when sequence quality
      and database coverage allow.

# Public presentation only; never used for pricing or eligibility.
presentation:
  equipment: "Thermocycleur et analyseur génétique Sanger"
  overview: "Cette prestation associe une analyse ciblée par PCR au séquençage Sanger et à la comparaison avec des séquences de référence. Le marqueur étudié dépend du microorganisme. L’extraction d’ADN doit être précisée dans le périmètre demandé."
